services:
  api:
    build:
      context: ../..
      dockerfile: deploy/preview/Dockerfile.api
    restart: unless-stopped
    environment:
      Recall__Url: http://0.0.0.0:8080
      Recall__DataDirectory: /data
      Recall__BootstrapToken: ${RECALL_BOOTSTRAP_TOKEN:?required}
    volumes:
      - recall-preview-data:/data
    expose:
      - "8080"

  mcp:
    build:
      context: ../..
      dockerfile: deploy/preview/Dockerfile.mcp-http
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
      RecallPreview__Enabled: "true"
      RecallPreview__AuthMode: ${RECALL_PREVIEW_AUTH_MODE:-StaticToken}
      RecallPreview__Token: ${RECALL_PREVIEW_TOKEN:-}
      RecallPreview__AllowedOrigins__0: ${RECALL_PREVIEW_ALLOWED_ORIGIN:?required}
      RecallPreview__AllowedHosts__0: ${RECALL_PREVIEW_HOST:?required}
      RecallPreview__PublicBaseUrl: ${RECALL_PREVIEW_PUBLIC_BASE_URL:-}
      RecallPreview__OAuth__Authority: ${RECALL_PREVIEW_OAUTH_AUTHORITY:-}
      RecallPreview__OAuth__Audience: ${RECALL_PREVIEW_OAUTH_AUDIENCE:-}
      RecallPreview__OAuth__RequiredScope: ${RECALL_PREVIEW_OAUTH_REQUIRED_SCOPE:-}
      RecallPreview__Tenants__0__Subject: ${RECALL_PREVIEW_TENANT_0_SUBJECT:-}
      RecallPreview__Tenants__0__ClientId: ${RECALL_PREVIEW_TENANT_0_CLIENT_ID:-}
      RecallPreview__Tenants__0__Token: ${RECALL_PREVIEW_TENANT_0_TOKEN:-}
      Recall__ApiUrl: http://api:8080
      RECALL_CLIENT_ID: ${RECALL_CLIENT_ID:-}
      RECALL_CLIENT_TOKEN: ${RECALL_CLIENT_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  recall-preview-data:
