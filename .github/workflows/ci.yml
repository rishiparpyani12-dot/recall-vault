name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore RecallVault.slnx --configfile NuGet.Config
      - name: Build and verify SQLCipher
        shell: pwsh
        run: ./eng/sqlcipher/build-windows.ps1
      - run: dotnet build RecallVault.slnx --no-restore --configuration Release
      - run: dotnet test RecallVault.slnx --no-build --configuration Release
