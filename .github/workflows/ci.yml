name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RecallVault.slnx
      - run: dotnet build RecallVault.slnx --no-restore --configuration Release
      - run: dotnet test RecallVault.slnx --no-build --configuration Release
